# S12 (#138) : microcache HTML pour les pages publiques de la liste blanche.
# Nitro pose X-Accel-Expires: CACHE_HTML_TTL_S (10 s) sur les routes autorisées ;
# nginx met en cache pour ce délai. Aucune purge : le contenu est régénéré au plus tard
# après le TTL.
proxy_cache_path /var/cache/nginx/brandself levels=1:2 keys_zone=brandself_html:10m max_size=256m inactive=10m use_temp_path=off;

# Clé de cache sans query string : les pages en cache ne lisent pas la query.
map $scheme$host$uri $bs_cache_key {
  default $scheme$host$uri;
}

# Contournement du cache si un cookie de session est présent (état utilisateur).
map $http_cookie $bs_session {
  default 0;
  ~*session_token 1;
}

# Webhooks de paiement : limite de débit par IP source (contexte http, comme les zones ci-dessus).
# Chaque requête non authentifiée sur /api/webhooks/ coûte un upsert SQL (compteur `webhooks_refuses`)
# avant le 401/413 : sans limite, un flot de requêtes bidon épuise le pool de connexions (10) et
# ralentit toute l'application, vrais webhooks compris. Utilisée par `location ^~ /api/webhooks/`
# (deploy/nginx/brandself-location.conf). Mémoire : 10m ~ 160 000 adresses IPv4 (64 octets par état).
limit_req_zone $binary_remote_addr zone=brandself_webhooks:10m rate=10r/s;

# EXEMPTION OPTIONNELLE de la plage du fournisseur (désactivée). Une clé vide n'est JAMAIS comptée
# par limit_req : il suffit de remplacer la clé de la zone ci-dessus par $bs_webhook_limit_key.
# Ne renseigner QUE des plages publiées par K-PAY (voir docs/exploitation-admin.md §9). Ne rien
# inventer : une plage trop large exempte des attaquants. Une IP exemptée n'est plus protégée.
#
# geo $bs_webhook_exempt {
#   default 0;
#   # <plage publiée par K-PAY, ex. a.b.c.d/nn> 1;
# }
# map $bs_webhook_exempt $bs_webhook_limit_key {
#   0 $binary_remote_addr;
#   1 "";
# }
# puis : limit_req_zone $bs_webhook_limit_key zone=brandself_webhooks:10m rate=10r/s;

# Médias (/medias/) : `Cache-Control: public, immutable` seulement pour un 200 (et le 304 qui le
# revalide). $status (statut FINAL) et non $upstream_status : ce dernier est vide sur un HIT du cache.
# Défaut vide : `add_header` n'ajoute pas un en-tête dont la valeur est vide, donc un 404 n'est jamais
# `public` ni `immutable`. Aucune valeur par défaut qui ouvre le cache longue durée.
map $status $bs_medias_cache_control {
  default "";
  200 "public, max-age=31536000, immutable";
  304 "public, max-age=31536000, immutable";
}

# Secret de rafraîchissement du cache des médias, HORS DÉPÔT : définit la variable $bs_medias_refresh
# (map). Include NON optionnel et sans joker : si le fichier manque, `nginx -t` échoue (voulu : sans
# lui, le bloc /medias/ référencerait une variable inconnue). Exemple : brandself-medias-secret.conf.exemple.
include /etc/nginx/brandself-medias-secret.conf;
