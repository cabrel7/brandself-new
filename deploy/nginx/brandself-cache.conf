# S12 (#138) : microcache HTML pour les pages publiques de la liste blanche.
# Nitro pose X-Accel-Expires: CACHE_HTML_TTL_S (10 s) sur les routes autorisées ;
# nginx met en cache pour ce délai. Aucune purge : le contenu est régénéré au plus tard
# après le TTL.
proxy_cache_path /var/cache/nginx/brandself levels=1:2 keys_zone=brandself_html:10m max_size=256m inactive=10m use_temp_path=off;

# Clé de cache sans query string : les pages en cache ne lisent pas la query.
map $scheme$host$uri $bs_cache_key {
  default $scheme$host$uri;
}

# Contournement du cache si un cookie de session est présent (état utilisateur).
map $http_cookie $bs_session {
  default 0;
  ~*session_token 1;
}
