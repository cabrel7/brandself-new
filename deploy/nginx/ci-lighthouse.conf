# S13-A : nginx de CI pour la DOUBLE MESURE Lighthouse (job `seo-perf`, .github/workflows/ci.yml).
# Reproduit ce que voit un visiteur en production : HTTP/2, TLS, gzip, mêmes `location`, même cache
# (brandself-cache.conf et brandself-location.conf, recopiés tels quels dans /etc/nginx/ par le workflow).
# Fichier COMPLET (events + http) lancé avec `nginx -c` : il ne remplace ni n'altère l'instance du paquet.
# Écoute sur 127.0.0.1:8443 uniquement. Certificat AUTO-SIGNÉ généré à la volée par le job
# (/etc/nginx/ci-tls/), jamais commité ; Chrome est lancé avec --ignore-certificate-errors.
# Proxy vers le serveur Node de production sur 127.0.0.1:3000 (déjà démarré par le job).
user www-data;
worker_processes 1;
pid /run/nginx-ci-lighthouse.pid;
error_log /var/log/nginx/ci-lighthouse.error.log warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /var/log/nginx/ci-lighthouse.access.log;

  # Zones de cache, maps, limite de débit : identiques à la production. Ce fichier inclut aussi
  # /etc/nginx/brandself-medias-secret.conf, que le job génère avec un secret aléatoire jetable.
  include /etc/nginx/brandself-cache.conf;

  server {
    listen 127.0.0.1:8443 ssl http2;
    server_name localhost;

    ssl_certificate /etc/nginx/ci-tls/cert.pem;
    ssl_certificate_key /etc/nginx/ci-tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # gzip, proxy, microcache et cache HTTP des fichiers statiques : le MÊME fichier qu'en production.
    include /etc/nginx/brandself-location.conf;
  }
}
