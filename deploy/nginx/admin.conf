# A1 (D-A1-01, D-A1-14, spec §5) : hôte d'administration admin.jesuis.pro.
#
# Défense en profondeur, mais Nginx est la BARRIÈRE DE RÉFÉRENCE : liste d'IP, liste blanche de
# chemins, en-têtes. L'application ajoute ses propres garde-fous (server/middleware/00-hote.ts,
# plugin Nitro, session superadmin sur /api/admin) ; ils ne couvrent pas tout (les fichiers de
# public/ comme sw.js, manifest.json, offline.html sont servis par Nitro avant le middleware) :
# ne jamais retirer l'une des couches parce que l'autre existe.
#
# Installation (à faire à la main, rien ici n'est exécuté par le dépôt) :
#   sudo cp deploy/nginx/admin.conf /etc/nginx/sites-available/brandself-admin.conf
#   sudo ln -s /etc/nginx/sites-available/brandself-admin.conf /etc/nginx/sites-enabled/
#   sudo cp deploy/nginx/admin-ip.conf.exemple /etc/nginx/brandself-admin-ip.conf   # puis ÉDITER (vraies IP, format geo)
#   sudo nginx -t && sudo systemctl reload nginx     # reload, jamais restart
# Voir docs/exploitation-admin.md pour l'ordre complet (DNS, certificat, liste d'IP).
#
# Prérequis réseau : l'enregistrement DNS de admin.jesuis.pro doit pointer DIRECTEMENT vers le VPS
# (pas de CDN ni de proxy devant : $remote_addr doit être l'IP réelle du client, sinon la liste d'IP
# ne protège rien).

# Liste d'IP autorisées (http) : fichier du SERVEUR, jamais versionné (adresses IP = données
# personnelles, D-A1-14). Modèle : deploy/nginx/admin-ip.conf.exemple (lignes `<adresse> 1;`).
# Variable = 1 si l'IP est listée, 0 sinon. Fichier absent : `nginx -t` échoue (voulu) ; fichier
# vide : tout est refusé.
# POURQUOI geo + if et pas allow/deny : `return` s'exécute en phase rewrite, AVANT la phase access
# où agissent allow/deny. Avec allow/deny, une IP hors liste recevrait un 302 sur `/` ou un 404 sur
# un chemin inconnu au lieu d'un 403 (le serveur se révélerait). Un `if ... return 403` placé au
# niveau du serveur s'exécute en rewrite, avant la sélection de location, donc avant tout autre return.
geo $admin_ip_ok {
  default 0;
  include /etc/nginx/brandself-admin-ip.conf;
}

# ---------------------------------------------------------------------------------------------
# Port 80 : défi ACME http-01 puis redirection HTTPS.
# Ce serveur n'inclut PAS la liste d'IP : le défi Let's Encrypt vient de leurs serveurs, il ne doit
# jamais être soumis à la liste d'IP (le bloc `geo`/`if` ne concerne que le serveur 443). La redirection ne révèle rien (aucun contenu servi en clair).
# ---------------------------------------------------------------------------------------------
server {
  listen 80;
  listen [::]:80;
  server_name admin.jesuis.pro;
  server_tokens off;

  access_log /var/log/nginx/admin.jesuis.pro.access.log;
  error_log /var/log/nginx/admin.jesuis.pro.error.log warn;

  # Explicite et AVANT la redirection : `^~` empêche toute expression régulière de passer devant.
  # Répertoire du mode webroot : `certbot certonly --webroot -w /var/www/certbot -d admin.jesuis.pro`
  # (créer le répertoire au besoin). Avec `certbot --nginx`, Certbot gère le défi lui-même, mais ce
  # bloc reste valable pour le renouvellement.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# ---------------------------------------------------------------------------------------------
# Port 443 : l'administration.
# ---------------------------------------------------------------------------------------------
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name admin.jesuis.pro;
  server_tokens off;

  # Certificat émis par Certbot (chemins standard Certbot pour ce nom ; vérifier après émission :
  # `sudo certbot certificates`).
  ssl_certificate /etc/letsencrypt/live/admin.jesuis.pro/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/admin.jesuis.pro/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;

  access_log /var/log/nginx/admin.jesuis.pro.access.log;
  error_log /var/log/nginx/admin.jesuis.pro.error.log warn;

  # PREMIÈRE instruction de rewrite du serveur : toute IP hors liste reçoit 403, quelle que soit
  # la location (302 de `/`, 404, proxy). Ne rien placer avant ce bloc.
  if ($admin_ip_ok = 0) {
    return 403;
  }

  # En-têtes de sécurité. `always` : présents aussi sur les 403/404/302 produits par Nginx.
  # IMPORTANT : aucune location ci-dessous ne contient `add_header`, sinon Nginx cesserait
  # d'hériter de ceux-ci. Les en-têtes équivalents posés par l'application sont masqués dans la
  # location proxy (proxy_hide_header) pour éviter les doublons.
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Cache-Control "no-store" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  gzip on;
  gzip_types text/css application/json application/javascript image/svg+xml;
  client_max_body_size 1m;

  # ORDRE DES PHASES : rewrite du serveur (le `if` ci-dessus) -> sélection de la location ->
  # rewrite de la location (les `return` ci-dessous). Le 403 passe donc toujours en premier.
  # ORDRE DES LOCATION (règle Nginx) : 1) `=` exact ; 2) préfixe `^~` le plus long (arrête la
  # recherche) ; 3) expressions régulières dans l'ORDRE DU FICHIER, la première qui correspond
  # gagne ; 4) à défaut, le plus long préfixe simple. Un préfixe simple (`location /api/...`) est
  # donc BATTU par une expression régulière qui correspond : c'est pourquoi le blocage du plugin
  # admin de Better Auth est une expression régulière placée AVANT celle du proxy.

  # `/` redirige vers la page d'administration (D-A1-01).
  location = / {
    return 302 /admin;
  }

  # Plugin admin de Better Auth : jamais exposé (D-A1-03). Doit précéder la location proxy,
  # dont `api/auth` capterait ce chemin. Couvre aussi `/api/auth/admin` sans barre finale.
  # `~*` : insensible à la casse (`/api/auth/ADMIN/set-role` ne doit pas passer).
  location ~* ^/api/auth/admin(/|$) {
    return 404;
  }

  # Seule liste de chemins transmise à l'application (l'appel interne de page d'erreur de Nuxt ne
  # passe pas par Nginx : pas de `__nuxt_error` ici). Reflète la liste blanche de
  # server/middleware/00-hote.ts : toute autre route (studio, vitrines, /mcp, /sw.js,
  # /manifest.json, /robots.txt, /sitemap*, /.well-known, /medias...) n'atteint jamais Node.
  # Ancrée sur le premier segment exact : `/administration` ou `/api/admin-x` ne correspondent pas.
  location ~ ^/(admin|api/admin|api/auth|_nuxt|_fonts|api/_nuxt_icon|brand)(/|$) {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    # Hôte : l'application détermine l'hôte admin depuis `Host` (jamais X-Forwarded-Host).
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # $remote_addr et non $proxy_add_x_forwarded_for : on écrase toute valeur fournie par le
    # client (server/utils/client-ip.ts n'accepte qu'une IP unique venant du proxy loopback).
    proxy_set_header X-Forwarded-For $remote_addr;
    # Ne jamais transmettre un en-tête d'IP forgeable.
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-Host "";

    # AUCUN cache ici : pas de proxy_cache ni de fastcgi_cache (réponses authentifiées).
    proxy_cache off;

    # Doublons évités : Nginx pose ces en-têtes (voir plus haut).
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Robots-Tag;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Accel-Expires;
  }

  # Icône : seul fichier racine autorisé.
  location = /favicon.ico {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-Host "";
    proxy_cache off;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Robots-Tag;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Accel-Expires;
  }

  # Tout le reste : 404 (corps Nginx, rien ne part vers l'application).
  location / {
    return 404;
  }
}
