# S12 : helper applicatif ne fait confiance qu'au proxy loopback.
# Microcache HTML sur les pages publiques de la liste blanche (#138).
location / {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;

  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  # Microcache : Nitro pose X-Accel-Expires sur les routes autorisées.
  proxy_cache brandself_html;
  proxy_cache_key $bs_cache_key;
  proxy_cache_valid 200 10s;
  proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
  proxy_cache_background_update on;
  proxy_cache_lock on;
  # Ne pas mettre en cache si cookie de session ou si Nitro ne pose pas X-Accel-Expires.
  proxy_cache_bypass $bs_session;
  proxy_no_cache $bs_session;
  add_header X-Cache-Status $upstream_cache_status always;

  # X-Accel-Expires posé par Nitro sur les routes autorisées.
  proxy_ignore_headers Cache-Control;
  proxy_hide_header Cache-Control;
}

# Médias : servis en cache longue durée (immutable).
location /medias/ {
  proxy_pass http://127.0.0.1:3000;
  proxy_cache brandself_html;
  proxy_cache_valid 200 1y;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  add_header X-Content-Type-Options "nosniff" always;
}

# Fichiers statiques Nuxt : mis en cache par le navigateur.
location /_nuxt/ {
  proxy_pass http://127.0.0.1:3000;
  proxy_cache brandself_html;
  proxy_cache_valid 200 1y;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Robots.txt et sitemap : jamais en cache (générés dynamiquement).
location = /robots.txt {
  proxy_pass http://127.0.0.1:3000;
  add_header Cache-Control "no-cache" always;
}
location = /sitemap_index.xml {
  proxy_pass http://127.0.0.1:3000;
  add_header Cache-Control "no-cache" always;
}
location ~ ^/sitemap.*\.xml$ {
  proxy_pass http://127.0.0.1:3000;
  add_header Cache-Control "no-cache" always;
}
