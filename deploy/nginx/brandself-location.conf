# S12 : helper applicatif ne fait confiance qu'au proxy loopback.
# Microcache HTML sur les pages publiques de la liste blanche (#138).

# A1 : l'administration n'existe que sur admin.jesuis.pro (deploy/nginx/admin.conf). Sur l'hôte
# public, ces chemins ne partent jamais vers l'application. Une expression régulière l'emporte sur
# le préfixe `location /` ci-dessous, mais elle est placée AVANT par lisibilité et parce que les
# expressions régulières sont évaluées dans l'ordre du fichier.
# `~*` : insensible à la casse (`/API/Admin/...` ne doit pas passer). Ancrée sur le PREMIER segment exact : `(/|$)` après le mot, donc `/administrateur`, `/admin-x`
# ou la vitrine d'un username commençant par « admin » ne sont pas touchés (`admin` lui-même est un
# mot réservé, shared/reserved.ts, donc aucune vitrine ne peut s'appeler ainsi). `/dr-cabrel/admin`
# n'est pas touché non plus (le premier segment est le username).
location ~* ^/(admin|api/admin|api/auth/admin)(/|$) {
  return 404;
}

# Webhooks de paiement (K-PAY) : limite de débit par IP, AVANT l'application (voir la zone
# `brandself_webhooks` dans brandself-cache.conf). `^~` : le préfixe l'emporte sur toute expression
# régulière, et la requête ne tombe pas dans `location /` (pas de microcache sur du POST signé).
# Débit : 10 r/s + burst 20 `nodelay`. Un fournisseur de paiement envoie quelques notifications par
# seconde au pic, avec des relances espacées ; 10 r/s soutenus + 20 en rafale (30 requêtes
# acceptées dans la première seconde) ne limitent jamais un usage légitime, mais un flot bidon est
# coupé en 429 AVANT d'atteindre Node et la base. `nodelay` : pas de mise en attente (un webhook
# n'attend pas), l'excédent reçoit 429 aussitôt ; K-PAY relance (le traitement est idempotent).
# Le 429 est journalisé au niveau `warn` dans error_log (repérer une attaque ou un seuil trop bas).
location ^~ /api/webhooks/ {
  limit_req zone=brandself_webhooks burst=20 nodelay;
  limit_req_status 429;
  limit_req_log_level warn;

  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  # $remote_addr et non $proxy_add_x_forwarded_for : on écrase toute valeur fournie par le client.
  proxy_set_header X-Forwarded-For $remote_addr;
  # Jamais de cache sur un webhook.
  proxy_cache off;
}

location / {
  proxy_pass http://127.0.0.1:3000;
  proxy_http_version 1.1;

  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;

  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";

  # Microcache : Nitro pose X-Accel-Expires sur les routes autorisées.
  proxy_cache brandself_html;
  proxy_cache_key $bs_cache_key;
  proxy_cache_valid 200 10s;
  proxy_cache_use_stale updating error timeout http_500 http_502 http_503;
  proxy_cache_background_update on;
  proxy_cache_lock on;
  # Ne pas mettre en cache si cookie de session ou si Nitro ne pose pas X-Accel-Expires.
  proxy_cache_bypass $bs_session;
  proxy_no_cache $bs_session;
  add_header X-Cache-Status $upstream_cache_status always;

  # X-Accel-Expires posé par Nitro sur les routes autorisées.
  proxy_ignore_headers Cache-Control;
  proxy_hide_header Cache-Control;
}

# Médias : servis en cache longue durée (immutable) pour les réponses 200 UNIQUEMENT.
# Décision du 2026-11-16 (docs/JOURNAL_DECISIONS.md) : un compte suspendu ou une vitrine bloquée ne
# sert plus aucune image. L'application répond alors 404 `no-store`, et une tâche de fond redemande
# chaque image avec `X-Cache-Refresh: <secret>` pour EXPULSER l'ancien 200 du cache (voir
# docs/exploitation-admin.md, « Images d'une vitrine masquée »).
location /medias/ {
  proxy_pass http://127.0.0.1:3000;
  proxy_cache brandself_html;
  proxy_cache_valid 200 1y;
  # Le 404 est mis en cache 1 minute : il REMPLACE l'ancien 200 (même clé). Une image réellement
  # absente est aussi mémorisée 1 minute (acceptable, évite de marteler Node).
  proxy_cache_valid 404 1m;

  # Le 404 de l'application porte `Cache-Control: no-store`, qui empêcherait nginx de l'enregistrer :
  # sans cette directive, l'ancien 200 resterait en cache. nginx ne s'en sert que pour SA décision
  # de cache ; l'en-tête est quand même transmis tel quel au client (pas de proxy_hide_header).
  proxy_ignore_headers Cache-Control Expires;

  # Rafraîchissement : $bs_medias_refresh vaut 1 UNIQUEMENT si l'en-tête X-Cache-Refresh est égal au
  # secret (map du fichier hors dépôt /etc/nginx/brandself-medias-secret.conf, inclus par
  # brandself-cache.conf). Absent ou faux : 0, aucun effet. Le bypass ne LIT pas le cache ; la
  # réponse de l'application, elle, est ENREGISTRÉE (c'est ce qui remplace l'ancien 200).
  proxy_cache_bypass $bs_medias_refresh;
  # L'en-tête secret n'est jamais transmis à l'application. Il n'est dans aucun log_format.
  proxy_set_header X-Cache-Refresh "";

  # `immutable` seulement sur 200 (et 304 de revalidation) : voir map $bs_medias_cache_control.
  # Valeur vide = en-tête non ajouté : un 404 garde le `no-store` de l'application.
  add_header Cache-Control $bs_medias_cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  # Diagnostic du cache (HIT, MISS, BYPASS) : aucune donnée sensible.
  add_header X-Cache-Status $upstream_cache_status always;
}

# Fichiers statiques Nuxt : mis en cache par le navigateur.
location /_nuxt/ {
  proxy_pass http://127.0.0.1:3000;
  proxy_cache brandself_html;
  proxy_cache_valid 200 1y;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Robots.txt et sitemap : jamais en cache (générés dynamiquement).
location = /robots.txt {
  proxy_pass http://127.0.0.1:3000;
  add_header Cache-Control "no-cache" always;
}
location = /sitemap_index.xml {
  proxy_pass http://127.0.0.1:3000;
  add_header Cache-Control "no-cache" always;
}
location ~ ^/sitemap.*\.xml$ {
  proxy_pass http://127.0.0.1:3000;
  add_header Cache-Control "no-cache" always;
}
