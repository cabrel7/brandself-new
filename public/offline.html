<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors ligne — jesuis.pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #FBF7F0;
      color: #231F1C;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
  h1 { font-family: 'Fraunces', Georgia, serif; font-size: 32px; margin-bottom: 12px; }
  p { font-size: 16px; line-height: 1.6; margin-bottom: 20px; max-width: 420px; }
  .icone-marque {
    width: 72px;
    height: 72px;
    border-radius: 18px;
    border: 1px solid #E6DCCB;
    background: #F3EBDD;
    margin-bottom: 24px;
  }
  a {
    color: #B4532F;
    text-decoration: none;
    font-weight: 600;
    border-bottom: 2px solid #B4532F;
    padding-bottom: 2px;
  }
  a:hover { color: #C1512A; }
  .bouton-reessayer {
    display: inline-block;
    margin-top: 8px;
    padding: 12px 24px;
    background: #B4532F;
    color: #fff;
    border: none;
    border-radius: 12px;
    font: 600 16px 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    cursor: pointer;
  }
  .bouton-reessayer:hover { background: #C1512A; }
  </style>
</head>
<body>
  <img src="/brand/icone.png" alt="" class="icone-marque" aria-hidden="true">
  <h1>Vous êtes hors ligne</h1>
  <p>Reconnectez-vous pour retrouver votre studio.</p>
  <button class="bouton-reessayer" onclick="location.reload()">Réessayer</button>
</body>
</html>
