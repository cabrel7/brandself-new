name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # Le build doit passer : valide la compilation Nuxt/Nitro de production.
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          NUXT_BETTER_AUTH_SECRET: secret-de-test-au-moins-trente-deux-caracteres

  e2e:
    runs-on: ubuntu-latest
    needs: verification
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: brandself
          POSTGRES_PASSWORD: brandself
          POSTGRES_DB: brandself_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brandself -d brandself_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Valeurs factices de test, non secrètes (jamais de vrai secret en CI).
      NODE_ENV: development
      DATABASE_URL: postgresql://brandself:brandself@localhost:5432/brandself_test
      REDIS_URL: redis://localhost:6379
      NUXT_BETTER_AUTH_SECRET: secret-de-test-au-moins-trente-deux-caracteres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Les scripts db:* et worker utilisent `node --env-file=.env` : le fichier doit exister.
      - name: Créer .env de test
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "REDIS_URL=$REDIS_URL"
            echo "NUXT_BETTER_AUTH_SECRET=$NUXT_BETTER_AUTH_SECRET"
          } > .env

      - run: pnpm db:migrate

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e
        env:
          CI: 'true'

      - name: Rapport Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
